<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>𐙚Music Mood Journal</title>
    </head>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family:Candara, sans-serif;
        }
        body{
            min-height: 800px;
            background:linear-gradient(135deg,#141e30,#243b55);
            color:white;
            background: linear-gradient(135deg,#1c1c2e,#2b2b45);
        }
        .navbar{
            display:flex;
            justify-content:space-between;
            align-items: center;
            padding:20px 50px;
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(10px)
        }
        .logo{
            font-size: 28px;
            font-weight: bold;
        }
        .hero{
            text-align: center;
            margin-top: 120px;
            padding:20px;
        }
        .hero h1{
            font-size: 64px;
            margin-bottom:15px;
        }
        .hero p{
            font-size:20px;
            opacity: 0.9;
            margin-bottom:30px;
        }
        .button{
            padding:15px 30px;
            border:none;
            border-radius: 30px;
            font-size:18px;
            cursor:pointer;
            font-weight:bold;
            background:white;
            color:#243b55;
            transition:0.3s;
        }
        .button:hover{
            transform:scale(1.05);
        }
    </style>
    <body>
        <div class="navbar">
            <div class="logo">𓍢♬ ₊˚.𐙚Music Mood Journal</div>
        </div>
        <div class ="hero">  
            <h1>Track your moods through music.</h1>
            <p>
                Every mood has a melody.
                Save your emotions and the songs that defined them.
            </p>
            <a href= "{% url 'journal' %}">
                <button class="button">Start Your Journey!</button>
            </a>
        </div>
    <script>
        function changeMood(){
            let mood=document.getElementById("mood").value;
            if(mood == "Happy"){
                document.body.style.background="linear-gradient(135deg,#FFD54F,#FFB300)";
            }
            else if(mood == "Sad"){
                document.body.style.background="linear-gradient(135deg,#5C6BC0,#3949AB)";
            }
            else if(mood == "Calm"){
                document.body.style.background="linear-gradient(135deg,#80CBC4,#26A69A)";
            }
            else if(mood == "Angry"){
                document.body.style.background="linear-gradient(135deg,#E55350,#D32F2F)";
            }
        }

    </script>
    </body>
</html>
